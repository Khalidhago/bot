name: HAGO UAS Bot CI

on:
  push:
    paths:
      - "hago-uas-bot/**"
    branches: [main]
  pull_request:
    paths:
      - "hago-uas-bot/**"

# Minimal permissions — jobs that need additional access override below
permissions:
  contents: read

defaults:
  run:
    working-directory: hago-uas-bot

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend: lint, type-check, unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint, Type-check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: hago-uas-bot/apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('hago-uas-bot/apps/api/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true  # non-blocking until full type coverage

      - name: Unit tests
        env:
          SECRET_KEY: "test_secret_key_32_bytes_xxxxxxxxxx"
          DATABASE_URL: "******localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          ENVIRONMENT: "development"
        run: pytest tests/unit/ -v --cov=app --cov-report=term-missing --cov-fail-under=70

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend: integration tests (with real PostgreSQL + Redis)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-integration:
    name: Backend — Integration Tests
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
    defaults:
      run:
        working-directory: hago-uas-bot/apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hago
          POSTGRES_PASSWORD: hago_test
          POSTGRES_DB: hago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DB migrations
        env:
          DATABASE_URL: "******localhost:5432/hago_test"
          SECRET_KEY: "test_secret_key_32_bytes_xxxxxxxxxx"
        run: alembic upgrade head

      - name: Integration tests
        env:
          SECRET_KEY: "test_secret_key_32_bytes_xxxxxxxxxx"
          DATABASE_URL: "******localhost:5432/hago_test"
          REDIS_URL: "redis://localhost:6379/0"
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          ENVIRONMENT: "development"
        run: pytest tests/integration/ -v

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: lint, type-check, build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint, Type-check & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: hago-uas-bot/apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hago-uas-bot/apps/web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npm run type-check

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker: validate docker-compose config
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        working-directory: hago-uas-bot
        run: docker compose config --quiet
