bot_base:
  ros__parameters:
    # Drivetrain geometry — keep in sync with bot_description/urdf/bot.urdf.xacro
    wheel_radius: 0.045        # m
    wheel_separation: 0.26     # m

    # Command limits enforced by the controller
    max_linear_speed: 0.6      # m/s
    max_angular_speed: 2.5     # rad/s
    max_wheel_speed: 20.0      # rad/s per wheel

    control_rate: 50.0         # Hz
    cmd_vel_timeout: 0.5       # s without cmd_vel before wheels are zeroed

    # Set publish_tf false if robot_localization/EKF owns odom->base_footprint
    publish_tf: true
    odom_frame: odom
    base_frame: base_footprint

    # Hardware
    use_mock_hardware: true
    serial_port: /dev/ttyUSB0
    serial_baudrate: 115200
